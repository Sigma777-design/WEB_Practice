<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Практичне заняття №2 — стилізована форма</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Форма реєстрації з лабораторної роботи №1 (розмітка без змін, додано лише клас reg-form) -->
  <form action="https://webhook.site/19de6224-82b8-479b-bde2-bc409cc69a35" method="POST" class="auth-form reg-form">
    <span class="reg-form__badge">Новий</span>
    <h2>Форма реєстрації</h2>

    <div class="form-group">
      <label for="first-name">Ім'я:</label>
      <input type="text" id="first-name" name="first_name" required>
    </div>

    <div class="form-group">
      <label for="last-name">Прізвище:</label>
      <input type="text" id="last-name" name="last_name" required>
    </div>

    <div class="form-group">
      <label for="email">Електронна пошта:</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
      <label for="password">Пароль:</label>
      <input type="password" id="password" name="password" required>
    </div>

    <div class="form-group">
      <label for="confirm-password">Підтвердження паролю:</label>
      <input type="password" id="confirm-password" name="confirm_password" required>
    </div>

    <div class="form-group">
      <label for="birthdate">Дата народження:</label>
      <input type="date" id="birthdate" name="birth_date">
    </div>

    <div class="form-group">
      <label for="gender">Стать:</label>
      <select id="gender" name="gender">
        <option value="not_specified">Не вказано</option>
        <option value="male">Чоловіча</option>
        <option value="female">Жіноча</option>
      </select>
    </div>

    <div class="form-group">
      <input type="submit" value="Зареєструватися" class="submit-btn">
    </div>
  </form>
</body>
</html>
